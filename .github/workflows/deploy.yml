name: Deploy to Coolify

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'context/**'
      - '**/*.md'
  # Pull requests run the test job only — see the `if` on the deploy job below. A gate that
  # first fires on a push to main reports the problem after it has already landed, which is
  # too late to be a gate at all.
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'context/**'
      - '**/*.md'
  workflow_dispatch:

# Coolify owns the build + release. This workflow gates on the test suite, then
# triggers Coolify and makes the GitHub status truthful: it captures the
# deployment_uuid, polls until the deployment reaches a terminal state, and confirms
# the app answers 200 on /health. A green check means the app is genuinely deployed
# and serving, not just that the API accepted the request. The self-hosted runner has
# no Docker daemon access, so there is no local image build — a broken build surfaces
# as deployment status=failed.
# JSON is parsed with grep/cut to avoid a jq dependency on the runner.

jobs:
  # Runs before anything is deployed, so an assertion the suite makes is an assertion
  # about main. Without this the tests only ever ran when someone chose to run them
  # locally, which made every guard in the suite advisory — including
  # DataAccessBoundaryTests, whose whole purpose is to stop a mistake reaching main.
  # The suite needs no network, no database and no secrets by design: SQLite in-memory
  # for the data tests, a stubbed HttpMessageHandler for the Supabase client.
  test:
    runs-on: [self-hosted, coolify]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The runner is not guaranteed to carry an SDK, and pinning it here keeps this
      # job independent of whatever happens to be installed on the box.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The test project links the system SQLite (SQLitePCLRaw.bundle_sqlite3) rather than
      # carrying its own build, because the bundled one needs GLIBC_2.33 and this runner is
      # Ubuntu 20.04 with 2.31. P/Invoke resolves that as "libsqlite3.so", and the image ships
      # only "libsqlite3.so.0" — the unversioned symlink lives in libsqlite3-dev. The runner is
      # a container, so installing by hand would vanish when it is recreated; doing it here
      # keeps it in git. No-op once the symlink exists.
      - name: Ensure libsqlite3 is loadable
        run: |
          if ldconfig -p | grep -q 'libsqlite3\.so '; then
            echo "libsqlite3.so already resolvable"
            exit 0
          fi
          SUDO=""; [ "$(id -u)" -eq 0 ] || SUDO=sudo
          $SUDO apt-get update -qq
          $SUDO apt-get install -y --no-install-recommends libsqlite3-dev
          ldconfig -p | grep 'libsqlite3\.so '

      - name: Run the test suite
        run: dotnet test 10xnotes.sln --configuration Release

  deploy:
    needs: test
    # Never deploy from a pull request: the branch is unmerged, and Coolify builds whatever
    # `main` is at trigger time regardless of the ref, so a PR deploy would be both premature
    # and misleading about what shipped.
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, coolify]
    steps:
      - name: Trigger Coolify deployment
        id: trigger
        run: |
          resp=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}") \
            || { echo "::error::Coolify deploy trigger failed"; exit 1; }
          echo "response: $resp"
          # Response is always array-wrapped: .deployments[0].deployment_uuid
          uuid=$(printf '%s' "$resp" | grep -o '"deployment_uuid":"[^"]*"' | head -1 | cut -d'"' -f4)
          [ -n "$uuid" ] || { echo "::error::No deployment_uuid in Coolify response"; exit 1; }
          echo "Deployment queued: $uuid"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for the deployment to finish
        run: |
          uuid="${{ steps.trigger.outputs.uuid }}"
          deadline=$(( $(date +%s) + 900 ))   # 15-minute cap
          dumped=0
          while :; do
            http=$(curl -s -o /tmp/dep.json -w '%{http_code}' \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
              "${{ secrets.COOLIFY_URL }}/api/v1/deployments/$uuid" || echo 000)
            case "$http" in
              200)
                if [ "$dumped" = 0 ]; then echo "raw deployment payload (first 800B): $(head -c 800 /tmp/dep.json)"; dumped=1; fi
                # Payload can also embed the app's "running:healthy" status; select only
                # the deployment-status enum value, ignoring colon-formatted app states.
                status=$(grep -o '"status":"[^"]*"' /tmp/dep.json | cut -d'"' -f4 \
                  | grep -Ex 'queued|in_progress|finished|failed|cancelled-by-user' | head -1)
                echo "deployment status: ${status:-unknown}"
                case "$status" in
                  finished)                  echo "Coolify reports finished"; break ;;
                  failed|cancelled-by-user)  echo "::error::Deployment $status"; exit 1 ;;
                esac ;;
              401|403)
                echo "::error::Poll got HTTP $http reading /api/v1/deployments — the COOLIFY_TOKEN needs the 'read' scope (it currently only has 'deploy'). Recreate the Coolify API token with read + deploy (or root) and update the COOLIFY_TOKEN secret."; exit 1 ;;
              404)
                echo "::error::Poll got HTTP 404 for /api/v1/deployments/$uuid — route missing on this Coolify version or deployment not queryable. Body: $(head -c 300 /tmp/dep.json)"; exit 1 ;;
              000)
                echo "runner could not reach ${{ secrets.COOLIFY_URL }} (network/DNS), retrying" ;;
              *)
                echo "poll HTTP $http, body: $(head -c 300 /tmp/dep.json) — retrying" ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out after 15m waiting for deployment $uuid"; exit 1
            fi
            sleep 10
          done

      - name: Verify the app actually serves /health
        run: |
          http=$(curl -s -o /tmp/app.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ secrets.COOLIFY_URL }}/api/v1/applications/${{ secrets.COOLIFY_APP_UUID }}" || echo 000)
          [ "$http" = "200" ] || { echo "::error::Reading the application returned HTTP $http (needs 'read' scope)"; exit 1; }
          # Coolify returns fqdn with JSON-escaped slashes (http:\/\/host) and possibly a
          # comma list. Unescape, take the first, strip the scheme to the bare host.
          host=$(grep -o '"fqdn":"[^"]*"' /tmp/app.json | head -1 | cut -d'"' -f4 \
            | sed 's#\\/#/#g' | cut -d',' -f1 | sed -E 's#^[a-zA-Z]+://##' | cut -d'/' -f1)
          [ -n "$host" ] || { echo "::error::App has no fqdn set in Coolify"; exit 1; }
          # A 200 alone is NOT proof the app is serving — an edge placeholder returns 200
          # for any path. MapHealthChecks("/health") returns the literal body "Healthy";
          # assert on that. The app is served over https at the edge (Coolify's fqdn may
          # still read http), so probe https first, then http.
          echo "verifying https/http //$host/health returns the app body 'Healthy'"
          for i in $(seq 1 20); do
            for url in "https://$host/health" "http://$host/health"; do
              body=$(curl -L -sS -m 12 "$url" 2>/dev/null || true)
              case "$body" in
                Healthy*) echo "App is serving: $url -> $body"; exit 0 ;;
              esac
            done
            echo "  attempt $i -> not the app yet"
            sleep 5
          done
          echo "::error::Neither https nor http //$host/health returned 'Healthy' — public URL not serving this app."; exit 1
